name: qavexbackgammongold
description: "Qavex Backgammon Gold — a premium offline backgammon game by QAVEX."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flame_audio: ^2.12.2
  flame: ^1.17.0
  in_app_purchase: ^3.2.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#1E2A26"
  image: assets/images/splash.png
  android_12:
    image: assets/images/splash.png
    color: "#1E2A26"
